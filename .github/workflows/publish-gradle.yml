name: Publish Gradle artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish
        required: false
        default: 1.0.0-SNAPSHOT
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: gamelan-gradle-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      # The repository's wrapper JAR is currently absent. Install the pinned
      # Gradle distribution directly and invoke `gradle`, not `./gradlew`.
      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Validate publish profile
        run: gradle gamelanProfiles --no-daemon

      - name: Publish reusable modules to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAMELAN_VERSION: ${{ github.event.inputs.version || '1.0.0-SNAPSHOT' }}
        run: |
          test -n "$GITHUB_TOKEN"
          gradle gamelanProfileRun \
            -Pgamelan.profile=publish \
            -Pgamelan.task=publish \
            --no-daemon \
            -x test \
            --parallel \
            -Pgamelan.publish.enabled=true \
            -Pgamelan.version="$GAMELAN_VERSION"
