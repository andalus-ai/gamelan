name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set up Gradle 9.4.0
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.4.0'

    - name: Validate Gradle profile catalog
      run: gradle gamelanProfiles --no-daemon

    - name: Compile publishable Gradle modules
      run: gradle gamelanProfileRun -Pgamelan.profile=publish -Pgamelan.task=classes --no-daemon --parallel -Pgamelan.version=1.0.0-SNAPSHOT

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn -B clean install -DskipTests

    - name: Generate error codes docs
      run: ./scripts/generate-error-codes.sh

    - name: Verify error codes docs are up-to-date
      run: |
        git status --porcelain
        git diff --exit-code docs/error-codes.md

    - name: Run tests
      run: mvn -B test

    - name: Run CLI module tests specifically
      run: mvn -B test -pl gamelan-cli

    - name: Verify CLI module builds
      run: |
        cd gamelan-cli
        mvn -B compile
        mvn -B test
        cd ..

    - name: Package CLI module
      run: |
        cd gamelan-cli
        mvn -B package -DskipTests
        cd ..

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamelan-cli-jar
        path: gamelan-cli/target/gamelan-cli-*.jar
        if-no-files-found: warn
